<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SMC & 威科夫 多維度量化跑分系統</title>
  <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #131722; color: #d1d4dc; padding: 15px; }
    .container { max-width: 1050px; margin: 0 auto; }
    .card { background: #1e222d; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #2a2e39; }
    .control-panel { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .inputs-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input, button { padding: 9px 12px; border-radius: 6px; border: 1px solid #363a45; background: #2a2e39; color: #fff; font-size: 14px; }
    input { width: 100px; }
    button { background: #2962ff; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #1e4bd8; }
    #chart-container { height: 480px; width: 100%; position: relative; margin-top: 10px; }
    .score-badge { padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 20px; }
    .score-high { background: #089981; color: #fff; }
    .score-low { background: #f23645; color: #fff; }
    .score-mid { background: #e2a000; color: #fff; }
    .plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; text-align: center; }
    .plan-box { background: #2a2e39; padding: 10px; border-radius: 6px; }
    .plan-box div:first-child { font-size: 12px; color: #787b86; margin-bottom: 4px; }
    .plan-box div:last-child { font-size: 16px; font-weight: bold; }
    
    .delta-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-right: 8px; }
    .tag-plus { background: rgba(8, 153, 129, 0.2); color: #089981; border: 1px solid #089981; }
    .tag-minus { background: rgba(242, 54, 69, 0.2); color: #f23645; border: 1px solid #f23645; }
    .reason-item { padding: 8px 0; border-bottom: 1px solid #2a2e39; font-size: 14px; display: flex; align-items: center; }
    .loading { text-align: center; padding: 15px; color: #2962ff; font-size: 15px; display: none; }
  </style>
</head>
<body>

<div class="container">
  <h2 style="margin-bottom: 15px; color: #fff;">📊 SMC & 威科夫 多維度量化個股分析儀</h2>

  <div class="card control-panel">
    <div class="inputs-group">
      <div>
        <label>股票代碼：</label>
        <input type="text" id="stockId" value="2615" placeholder="例如 2615">
      </div>
      <div>
        <label>盈虧比 (R:R)：</label>
        <input type="number" id="rrRatio" value="3.0" step="0.5" min="1">
      </div>
      <button onclick="analyzeStock()">開始量化跑分</button>
    </div>
    <span style="font-size: 12px; color: #787b86;">SMC 訂單塊 (OB) + 均線 + RSI 強力風控鎖定</span>
  </div>

  <div id="loading" class="loading">⏳ 正在計算 SMC 樞紐點、訂單塊 (OB) 與風控鎖定...</div>

  <div class="card" id="resultCard" style="display:none;">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
      <div>
        <h3 style="font-size: 22px; color: #fff;">
          <span id="stockTitle"></span>
          <span style="font-size: 18px; margin-left: 10px;" id="signalText"></span>
        </h3>
        <p style="font-size: 13px; color: #787b86; margin-top: 4px;">基準分 50 分 | 包含 SMC 機構訂單塊壓制警訊與點位規劃</p>
      </div>
      <div id="scoreBadge" class="score-badge"></div>
    </div>

    <div class="plan-grid">
      <div class="plan-box"><div>建議位 (Close)</div><div id="pEntry" style="color:#2962ff;">-</div></div>
      <div class="plan-box"><div>建議止損位</div><div id="pStop" style="color:#f23645;">-</div></div>
      <div class="plan-box"><div>目標止盈位</div><div id="pTake" style="color:#089981;">-</div></div>
      <div class="plan-box"><div>預設盈虧比</div><div id="pRR">-</div></div>
    </div>

    <h4 style="margin-top: 18px; color: #fff;">⚖️ 真實指標評分依據明細：</h4>
    <div id="reasonsContainer" style="margin-top: 8px;"></div>
  </div>

  <div class="card" style="position: relative;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="color: #fff;" id="chartTitle">📉 互動 K 線圖 (標示 SMC 訂單塊與波段關卡)</h3>
      <span style="font-size: 12px; color: #787b86;">日期格式: YYYY/MM/DD</span>
    </div>
    <div id="chart-container"></div>
  </div>
</div>

<script>
  let chart = null;
  let candlestickSeries = null;
  let priceLines = [];

  const WORKER_URL = "https://stock-api.senmao.workers.dev";

  function initChart() {
    const container = document.getElementById('chart-container');
    if (!container || chart) return;

    chart = LightweightCharts.createChart(container, {
      width: container.clientWidth,
      height: 480,
      layout: { backgroundColor: '#1e222d', textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#2b2e3a' }, horzLines: { color: '#2b2e3a' } },
      timeScale: { pinchZoom: true, mouseWheel: true, timeVisible: true },
      localization: {
        dateFormat: 'yyyy/MM/dd',
        timeFormatter: (timeStr) => {
          if (typeof timeStr === 'string') return timeStr.replace(/-/g, '/');
          if (typeof timeStr === 'object' && timeStr.year) {
            const m = String(timeStr.month).padStart(2, '0');
            const d = String(timeStr.day).padStart(2, '0');
            return `${timeStr.year}/${m}/${d}`;
          }
          return timeStr;
        }
      }
    });

    candlestickSeries = chart.addCandlestickSeries({
      upColor: '#089981', downColor: '#f23645',
      borderUpColor: '#089981', borderDownColor: '#f23645',
      wickUpColor: '#089981', wickDownColor: '#f23645'
    });

    window.addEventListener('resize', () => {
      if (chart && container) chart.applyOptions({ width: container.clientWidth });
    });
  }

  function clearPriceLines() {
    if (candlestickSeries && priceLines.length > 0) {
      priceLines.forEach(line => candlestickSeries.removePriceLine(line));
      priceLines = [];
    }
  }

  function drawSMCLines(smc) {
    clearPriceLines();
    if (!smc) return;

    const lines = [
      { price: smc.bearish_ob.top, color: '#f23645', title: '🔴 Bearish OB 頂部 ($' + smc.bearish_ob.top + ')' },
      { price: smc.bearish_ob.bottom, color: '#f23645', title: '🔴 Bearish OB 賣壓下軌 ($' + smc.bearish_ob.bottom + ')' },
      { price: smc.fib_0382, color: '#e2a000', title: 'Fib 0.382' },
      { price: smc.fib_0500, color: '#2962ff', title: 'Fib 0.500' },
      { price: smc.fib_0618, color: '#089981', title: 'Fib 0.618 (折扣進場區)' },
      { price: smc.bullish_ob.top, color: '#1848cc', title: '🔵 Bullish OB 買盤上軌 ($' + smc.bullish_ob.top + ')' },
      { price: smc.bullish_ob.bottom, color: '#1848cc', title: '🔵 Bullish OB 底部 ($' + smc.bullish_ob.bottom + ')' }
    ];

    lines.forEach(l => {
      const pl = candlestickSeries.createPriceLine({
        price: l.price,
        color: l.color,
        lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: l.title
      });
      priceLines.push(pl);
    });
  }

  async function analyzeStock() {
    const stockId = document.getElementById('stockId').value.trim();
    const rr = document.getElementById('rrRatio').value;
    const loading = document.getElementById('loading');
    const resultCard = document.getElementById('resultCard');

    if (!stockId) return alert('請輸入股票代碼');
    if (!chart || !candlestickSeries) initChart();

    loading.style.display = 'block';
    resultCard.style.display = 'none';

    try {
      const res = await fetch(`${WORKER_URL}/?stock_id=${stockId}&rr=${rr}`);
      const data = await res.json();

      if (data.error) throw new Error(data.error);

      if (candlestickSeries && data.kline && data.kline.length > 0) {
        candlestickSeries.setData(data.kline);
        chart.timeScale().fitContent();
        drawSMCLines(data.smc_levels);
      }

      const displayName = data.stock_name ? `${data.stock_id} ${data.stock_name}` : data.stock_id;
      document.getElementById('stockTitle').innerText = displayName;
      document.getElementById('chartTitle').innerText = `📉 ${displayName} K 線圖 (標示 SMC 訂單塊)`;

      document.getElementById('signalText').innerText = `[${data.signal}]`;
      const badge = document.getElementById('scoreBadge');
      badge.innerText = `${data.score} 分`;
      badge.className = `score-badge ${data.score >= 60 ? 'score-high' : data.score <= 45 ? 'score-low' : 'score-mid'}`;

      document.getElementById('pEntry').innerText = `$${data.trade_plan.entry}`;
      document.getElementById('pStop').innerText = `$${data.trade_plan.stop_loss}`;
      document.getElementById('pTake').innerText = `$${data.trade_plan.take_profit}`;
      document.getElementById('pRR').innerText = `1 : ${data.trade_plan.rr_ratio}`;

      const reasonsContainer = document.getElementById('reasonsContainer');
      reasonsContainer.innerHTML = '';
      const breakdown = data.score_breakdown || [];
      if (breakdown.length > 0) {
        breakdown.forEach(item => {
          const div = document.createElement('div');
          div.className = 'reason-item';
          const isPlus = item.type === 'PLUS';
          div.innerHTML = `
            <span class="delta-tag ${isPlus ? 'tag-plus' : 'tag-minus'}">${item.delta}</span>
            <span>${item.reason}</span>
          `;
          reasonsContainer.appendChild(div);
        });
      }

      resultCard.style.display = 'block';
    } catch (err) {
      alert('分析失敗：' + err.message);
    } finally {
      loading.style.display = 'none';
    }
  }

  window.onload = () => {
    initChart();
    analyzeStock();
  };
</script>

</body>
</html>
