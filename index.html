<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TRADING HELPER - 多維度量化個股分析儀</title>
  <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #131722; color: #d1d4dc; padding: 15px; }
    .container { max-width: 1050px; margin: 0 auto; }
    .card { background: #1e222d; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #2a2e39; }
    .control-panel { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: flex-start; }
    .inputs-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; width: 100%; }
    input, button, select { padding: 9px 12px; border-radius: 6px; border: 1px solid #363a45; background: #2a2e39; color: #fff; font-size: 14px; }
    input { width: 90px; }
    button { background: #2962ff; border: none; cursor: pointer; font-weight: bold; color: #fff; }
    button:hover { background: #1e4bd8; }
    .btn-log { background: #363a45; color: #d1d4dc; border: 1px solid #555; }
    .btn-log:hover { background: #4e5361; }
    
    .chart-wrapper { position: relative; width: 100%; height: 480px; margin-top: 10px; }
    #chart-container { width: 100%; height: 100%; }
    #overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

    .score-badge { padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 20px; }
    .score-high { background: #089981; color: #fff; }
    .score-mid { background: #e2a000; color: #fff; }
    .score-low { background: #f23645; color: #fff; }
    
    .plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; text-align: center; }
    .plan-box { background: #2a2e39; padding: 10px; border-radius: 6px; }
    .plan-box div:first-child { font-size: 12px; color: #787b86; margin-bottom: 4px; }
    .plan-box div:last-child { font-size: 16px; font-weight: bold; }
    
    .delta-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-right: 8px; }
    .tag-plus { background: rgba(8, 153, 129, 0.2); color: #089981; border: 1px solid #089981; }
    .tag-minus { background: rgba(242, 54, 69, 0.2); color: #f23645; border: 1px solid #f23645; }
    .reason-item { padding: 8px 0; border-bottom: 1px solid #2a2e39; font-size: 14px; display: flex; align-items: center; }
    .loading { text-align: center; padding: 15px; color: #2962ff; font-size: 15px; display: none; }

    .toggle-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .toggle-btn { padding: 5px 8px; font-size: 11px; border-radius: 4px; border: 1px solid #363a45; background: #2a2e39; cursor: pointer; color: #888; }
    .toggle-btn.active { background: #2962ff; color: #fff; border-color: #2962ff; }

    .quote-badge { font-size: 16px; font-weight: bold; padding: 4px 10px; border-radius: 6px; display: inline-block; margin-left: 10px; }
    .quote-up { background: rgba(8, 153, 129, 0.2); color: #089981; border: 1px solid #089981; }
    .quote-down { background: rgba(242, 54, 69, 0.2); color: #f23645; border: 1px solid #f23645; }

    .news-item { padding: 10px 0; border-bottom: 1px solid #2a2e39; font-size: 14px; display: flex; justify-content: space-between; gap: 15px; align-items: center; }
    .news-link { color: #58a6ff; text-decoration: underline; font-weight: 500; cursor: pointer; }
    .news-link:hover { color: #79c0ff; }
    .news-date { color: #787b86; white-space: nowrap; font-size: 12px; }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0b0e14;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .splash-content {
      text-align: center;
      width: 360px;
    }
    .splash-logo {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 3px;
      margin-bottom: 25px;
      text-shadow: 0 0 20px rgba(41, 98, 255, 0.6);
      animation: pulseLogo 1.5s infinite alternate;
    }
    .splash-logo span { color: #2962ff; }
    .loading-bar-track {
      width: 100%;
      height: 6px;
      background: #1e222d;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid #2a2e39;
    }
    .loading-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2962ff, #089981);
      border-radius: 3px;
      box-shadow: 0 0 12px rgba(8, 153, 129, 0.8);
      transition: width 0.1s linear;
    }
    .loading-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 13px;
      color: #787b86;
      font-family: monospace;
    }
    @keyframes pulseLogo {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.03); opacity: 1; text-shadow: 0 0 30px rgba(41, 98, 255, 0.9); }
    }
  </style>
</head>
<body>

<div id="splash-screen">
  <div class="splash-content">
    <div class="splash-logo">TRADING <span>HELPER</span></div>
    <div class="loading-bar-track">
      <div id="loadingBarFill" class="loading-bar-fill"></div>
    </div>
    <div class="loading-info">
      <span>INITIALIZING ENGINE...</span>
      <span id="loadingPct">0%</span>
    </div>
  </div>
</div>

<div class="container">
  <h2 style="margin-bottom: 15px; color: #fff;">📊 TRADING HELPER | 多維度量化個股分析儀</h2>

  <div class="card control-panel">
    <div class="inputs-group">
      <div>
        <label>股票代碼：</label>
        <input type="text" id="stockId" value="2330" placeholder="例如 2330">
      </div>
      <div>
        <label>投資週期：</label>
        <select id="timeframeSelect">
          <option value="short">短線波段 (Swing)</option>
          <option value="long">長線存股 (Long-term)</option>
        </select>
      </div>
      <div>
        <label>盈虧比：</label>
        <input type="number" id="rrRatio" value="3.0" step="0.5" min="1">
      </div>
      <button onclick="analyzeStock()">開始量化跑分</button>
      <button class="btn-log" onclick="downloadLogs()">📥 下載運行 Log</button>
    </div>
  </div>

  <div id="loading" class="loading">⏳ 正在同步技術面、基本面與最新新聞情報...</div>

  <div class="card" id="resultCard" style="display:none;">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
      <div>
        <h3 style="font-size: 22px; color: #fff; display: flex; align-items: center; flex-wrap: wrap;">
          <span id="stockTitle"></span>
          <span id="quoteInfo" class="quote-badge"></span>
          <span style="font-size: 18px; margin-left: 15px;" id="signalText"></span>
        </h3>
      </div>
      <div id="scoreBadge" class="score-badge"></div>
    </div>

    <div class="plan-grid">
      <div class="plan-box"><div>建議入場位</div><div id="pEntry" style="color:#2962ff;">-</div></div>
      <div class="plan-box"><div>建議硬止損位</div><div id="pStop" style="color:#f23645;">-</div></div>
      <div class="plan-box"><div>目標止盈位</div><div id="pTake" style="color:#089981;">-</div></div>
      <div class="plan-box"><div>預計收益率</div><div id="pProfit">-</div></div>
    </div>

    <div class="plan-grid" style="margin-top: 10px;">
      <div class="plan-box"><div>本益比 (PE)</div><div id="fundPE" style="color:#d1d4dc;">-</div></div>
      <div class="plan-box"><div>股價淨值比 (PB)</div><div id="fundPB" style="color:#d1d4dc;">-</div></div>
      <div class="plan-box" style="grid-column: span 2;"><div>現金殖利率 (Yield)</div><div id="fundYield" style="color:#089981;">-</div></div>
    </div>

    <div style="margin-top: 15px; padding: 12px; background: #262b38; border-radius: 6px; border-left: 4px solid #2962ff;">
      <h4 style="color: #fff; margin-bottom: 6px;">💡 TRADING HELPER 操盤具體策略建議：</h4>
      <p id="strategyAdvice" style="font-size: 14px; color: #d1d4dc; line-height: 1.6;"></p>
    </div>

    <h4 style="margin-top: 18px; color: #fff;">⚖️ TRADING HELPER 量化評分依據明細：</h4>
    <div id="reasonsContainer" style="margin-top: 8px;"></div>
  </div>

  <div class="card" id="newsCard" style="display:none;">
    <h3 style="color: #fff; margin-bottom: 10px;">📰 最新個股新聞情報與輿論 (點擊標題可直接 Google 搜尋)</h3>
    <div id="newsList"></div>
  </div>

  <div class="card" style="position: relative;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
      <h3 style="color: #fff;" id="chartTitle">📉 互動 K 線圖</h3>
      
      <div class="toggle-group">
        <span style="font-size: 12px; color: #787b86;">圖示開關：</span>
        <button id="btnToggleOB" class="toggle-btn active" onclick="toggleOverlay('OB')">SMC 訂單塊</button>
        <button id="btnToggleWyckoff" class="toggle-btn active" onclick="toggleOverlay('WYCKOFF')">威科夫箱體</button>
        <button id="btnToggleLines" class="toggle-btn active" onclick="toggleOverlay('LINES')">關卡水平線</button>
        <button id="btnToggleFibRet" class="toggle-btn active" onclick="toggleOverlay('FIB_RET')">FIB 回撤</button>
        <button id="btnToggleFibExt" class="toggle-btn active" onclick="toggleOverlay('FIB_EXT')">FIB 擴展</button>
      </div>
    </div>

    <div class="chart-wrapper">
      <div id="chart-container"></div>
      <canvas id="overlay-canvas"></canvas>
    </div>
  </div>
</div>

<script>
  let chart = null;
  let candlestickSeries = null;
  let priceLines = [];
  let fibRetLines = [];
  let fibExtLines = [];
  let rawResponseData = null;

  let showOB = true;
  let showWyckoff = true;
  let showLines = true;
  let showFibRet = true;
  let showFibExt = true;

  const WORKER_URL = "https://stock-api.senmao.workers.dev";
  let appLogs = [];

  function addLog(level, message, data = null) {
    const timestamp = new Date().toISOString();
    const logEntry = `[${timestamp}] [${level}] ${message} ${data ? JSON.stringify(data) : ''}`;
    appLogs.push(logEntry);
    console.log(logEntry);
  }

  function downloadLogs() {
    addLog('INFO', '使用者點擊下載運行 Log');
    const blob = new Blob([appLogs.join('\n')], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `trading_helper_log_${new Date().toISOString().slice(0,10)}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  window.addEventListener('load', () => {
    addLog('INFO', '應用程式啟動，載入開機過場動畫');
    const fill = document.getElementById('loadingBarFill');
    const pctText = document.getElementById('loadingPct');
    const splash = document.getElementById('splash-screen');

    let currentPct = 0;
    const startTime = Date.now();
    const minDuration = 1200;

    const interval = setInterval(() => {
      currentPct += Math.floor(Math.random() * 8) + 4;
      if (currentPct > 100) currentPct = 100;

      if(fill) fill.style.width = currentPct + '%';
      if(pctText) pctText.innerText = currentPct + '%';

      if (currentPct === 100) {
        clearInterval(interval);
        const elapsed = Date.now() - startTime;
        const remainingTime = Math.max(0, minDuration - elapsed);

        setTimeout(() => {
          if(splash) splash.classList.add('fade-out');
          addLog('INFO', '開機動畫結束，進入主介面');
        }, remainingTime);
      }
    }, 30);
  });

  function initChart() {
    const container = document.getElementById('chart-container');
    if (!container || chart) return;
    addLog('INFO', '初始化圖表引擎');

    chart = LightweightCharts.createChart(container, {
      width: container.clientWidth,
      height: 480,
      layout: { backgroundColor: '#1e222d', textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#2b2e3a' }, horzLines: { color: '#2b2e3a' } },
      timeScale: { pinchZoom: true, mouseWheel: true, timeVisible: true },
      // 🚀 關鍵修復：啟用 Y 軸動態自動縮放，並設定上下留白邊距以徹底消除下方 0.00 死區
      rightPriceScale: {
        autoScale: true,
        scaleMargins: {
          top: 0.15,
          bottom: 0.15,
        },
      },
      localization: {
        dateFormat: 'yyyy/MM/dd',
        timeFormatter: (timeStr) => {
          if (typeof timeStr === 'string') return timeStr.replace(/-/g, '/');
          if (typeof timeStr === 'object' && timeStr.year) {
            const m = String(timeStr.month).padStart(2, '0');
            const d = String(timeStr.day).padStart(2, '0');
            return `${timeStr.year}/${m}/${d}`;
          }
          return timeStr;
        }
      }
    });

    candlestickSeries = chart.addCandlestickSeries({
      upColor: '#089981', downColor: '#f23645',
      borderUpColor: '#089981', borderDownColor: '#f23645',
      wickUpColor: '#089981', wickDownColor: '#f23645'
    });

    chart.timeScale().subscribeVisibleLogicalRangeChange(() => drawCanvasBoxes());
    chart.timeScale().subscribeCrosshairMove(() => drawCanvasBoxes());

    window.addEventListener('resize', () => {
      if (chart && container) {
        chart.applyOptions({ width: container.clientWidth });
        drawCanvasBoxes();
      }
    });
  }

  function toggleOverlay(type) {
    if (type === 'OB') {
      showOB = !showOB;
      document.getElementById('btnToggleOB').classList.toggle('active', showOB);
      addLog('DEBUG', `切換圖層 SMC 訂單塊: ${showOB}`);
    } else if (type === 'WYCKOFF') {
      showWyckoff = !showWyckoff;
      document.getElementById('btnToggleWyckoff').classList.toggle('active', showWyckoff);
      addLog('DEBUG', `切換圖層 威科夫箱體: ${showWyckoff}`);
    } else if (type === 'LINES') {
      showLines = !showLines;
      document.getElementById('btnToggleLines').classList.toggle('active', showLines);
      addLog('DEBUG', `切換圖層 關卡水平線: ${showLines}`);
      if (showLines && rawResponseData) renderPriceLines(rawResponseData.price_lines);
      else clearPriceLines();
    } else if (type === 'FIB_RET') {
      showFibRet = !showFibRet;
      document.getElementById('btnToggleFibRet').classList.toggle('active', showFibRet);
      addLog('DEBUG', `切換圖層 FIB 回撤: ${showFibRet}`);
      if (showFibRet && rawResponseData) renderFibRetLines(rawResponseData.fib_retracement);
      else clearFibRetLines();
    } else if (type === 'FIB_EXT') {
      showFibExt = !showFibExt;
      document.getElementById('btnToggleFibExt').classList.toggle('active', showFibExt);
      addLog('DEBUG', `切換圖層 FIB 擴展: ${showFibExt}`);
      if (showFibExt && rawResponseData) renderFibExtLines(rawResponseData.fib_extension);
      else clearFibExtLines();
    }
    drawCanvasBoxes();
  }

  function clearPriceLines() {
    if (candlestickSeries && priceLines.length > 0) {
      priceLines.forEach(line => {
        try { candlestickSeries.removePriceLine(line); } catch(e){}
      });
      priceLines = [];
    }
  }

  function renderPriceLines(lines) {
    clearPriceLines();
    if (!lines || !Array.isArray(lines) || !showLines) return;

    lines.forEach(l => {
      if (l && l.price && !isNaN(l.price)) {
        try {
          const pl = candlestickSeries.createPriceLine({
            price: Number(l.price),
            color: l.color || '#2962ff',
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: l.title || ''
          });
          priceLines.push(pl);
        } catch (e) {}
      }
    });
  }

  function clearFibRetLines() {
    if (candlestickSeries && fibRetLines.length > 0) {
      fibRetLines.forEach(line => {
        try { candlestickSeries.removePriceLine(line); } catch(e){}
      });
      fibRetLines = [];
    }
  }

  function renderFibRetLines(lines) {
    clearFibRetLines();
    if (!lines || !Array.isArray(lines) || !showFibRet) return;

    lines.forEach(l => {
      if (l && l.price && !isNaN(l.price)) {
        try {
          const pl = candlestickSeries.createPriceLine({
            price: Number(l.price),
            color: l.color || '#ab47bc',
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dotted,
            axisLabelVisible: true,
            title: l.title || ''
          });
          fibRetLines.push(pl);
        } catch (e) {}
      }
    });
  }

  function clearFibExtLines() {
    if (candlestickSeries && fibExtLines.length > 0) {
      fibExtLines.forEach(line => {
        try { candlestickSeries.removePriceLine(line); } catch(e){}
      });
      fibExtLines = [];
    }
  }

  function renderFibExtLines(lines) {
    clearFibExtLines();
    if (!lines || !Array.isArray(lines) || !showFibExt) return;

    lines.forEach(l => {
      if (l && l.price && !isNaN(l.price)) {
        try {
          const pl = candlestickSeries.createPriceLine({
            price: Number(l.price),
            color: l.color || '#ff7043',
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dotted,
            axisLabelVisible: true,
            title: l.title || ''
          });
          fibExtLines.push(pl);
        } catch (e) {}
      }
    });
  }

  function drawCanvasBoxes() {
    try {
      const canvas = document.getElementById('overlay-canvas');
      const container = document.getElementById('chart-container');
      if (!canvas || !container || !chart || !candlestickSeries || !rawResponseData) return;

      const dpr = window.devicePixelRatio || 1;
      canvas.width = container.clientWidth * dpr;
      canvas.height = container.clientHeight * dpr;

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, container.clientWidth, container.clientHeight);

      const timeScale = chart.timeScale();

      if (showWyckoff && rawResponseData.wyckoff_box) {
        const box = rawResponseData.wyckoff_box;
        const y1 = candlestickSeries.priceToCoordinate(box.top);
        const y2 = candlestickSeries.priceToCoordinate(box.bottom);

        if (y1 !== null && y2 !== null) {
          let x1 = 0;
          if (box.startTime) {
            const coord = timeScale.timeToCoordinate(box.startTime);
            if (coord !== null && coord > 0) x1 = coord;
          }
          const x2 = timeScale.timeToCoordinate(rawResponseData.kline[Math.floor(rawResponseData.kline.length / 2)].time) || container.clientWidth / 2;

          const rectY = Math.min(y1, y2);
          const rectH = Math.abs(y2 - y1);
          const rectW = Math.max(50, x2 - x1);

          ctx.fillStyle = box.color;
          ctx.fillRect(x1, rectY, rectW, rectH);

          ctx.strokeStyle = box.borderColor;
          ctx.lineWidth = 1.5;
          ctx.setLineDash([6, 6]);
          ctx.strokeRect(x1, rectY, rectW, rectH);
          ctx.setLineDash([]);

          ctx.fillStyle = box.borderColor;
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText(box.label, x1 + 10, rectY + 20);
        }
      }

      if (showOB && rawResponseData.smc_boxes) {
        rawResponseData.smc_boxes.forEach(box => {
          if (!box.top || !box.bottom) return;

          const y1 = candlestickSeries.priceToCoordinate(box.top);
          const y2 = candlestickSeries.priceToCoordinate(box.bottom);

          if (y1 !== null && y2 !== null) {
            let x1 = 0;
            if (box.startTime) {
              const coord = timeScale.timeToCoordinate(box.startTime);
              if (coord !== null && coord > 0) x1 = coord;
            }
            const x2 = container.clientWidth;

            const rectY = Math.min(y1, y2);
            const rectH = Math.abs(y2 - y1);
            const rectW = Math.max(10, x2 - x1);

            ctx.fillStyle = box.color || 'rgba(242, 54, 69, 0.3)';
            ctx.fillRect(x1, rectY, rectW, rectH);

            ctx.strokeStyle = box.borderColor || '#f23645';
            ctx.lineWidth = 1;
            ctx.strokeRect(x1, rectY, rectW, rectH);

            ctx.fillStyle = box.borderColor || '#ffffff';
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText(box.label || 'Order Block', x1 + 10, rectY + 16);
          }
        });
      }

    } catch (e) {
      addLog('ERROR', 'Canvas 繪製圖層錯誤', e.toString());
    }
  }

  async function analyzeStock() {
    const stockId = document.getElementById('stockId').value.trim();
    const timeframe = document.getElementById('timeframeSelect').value;
    const rr = document.getElementById('rrRatio').value;
    const loading = document.getElementById('loading');
    const resultCard = document.getElementById('resultCard');
    const newsCard = document.getElementById('newsCard');

    addLog('INFO', `準備發起量化分析請求`, { stockId, timeframe, rr });

    if (!stockId) {
      addLog('WARN', '使用者未輸入股票代碼');
      return alert('請輸入股票代碼');
    }
    if (!chart || !candlestickSeries) initChart();

    loading.style.display = 'block';
    resultCard.style.display = 'none';
    newsCard.style.display = 'none';

    try {
      const targetUrl = `${WORKER_URL}/?stock_id=${stockId}&timeframe=${timeframe}&rr=${rr}`;
      addLog('INFO', `向 Worker 發送 Fetch 請求: ${targetUrl}`);

      const res = await fetch(targetUrl);
      addLog('INFO', `收到 Worker 回應狀態碼: ${res.status}`);

      const data = await res.json();
      addLog('INFO', `成功解析 API 回應 JSON`, data);

      rawResponseData = data;

      if (data.error) {
        addLog('ERROR', `API 回傳業務邏輯錯誤: ${data.error}`);
        throw new Error(data.error);
      }

      if (candlestickSeries && data.kline && data.kline.length > 0) {
        addLog('INFO', `載入 K 線資料筆數: ${data.kline.length}`);
        candlestickSeries.setData(data.kline);
        chart.timeScale().fitContent();

        renderPriceLines(data.price_lines);
        renderFibRetLines(data.fib_retracement);
        renderFibExtLines(data.fib_extension);

        if (data.markers && Array.isArray(data.markers)) {
          const sortedMarkers = [...data.markers].sort((a, b) => (a.time > b.time ? 1 : -1));
          candlestickSeries.setMarkers(sortedMarkers);
        }

        setTimeout(() => drawCanvasBoxes(), 150);
      } else {
        addLog('WARN', 'K 線資料不足或格式不符');
      }

      const displayName = data.stock_name ? `${data.stock_id} ${data.stock_name}` : data.stock_id;
      document.getElementById('stockTitle').innerText = displayName;

      const q = data.quote;
      const quoteInfo = document.getElementById('quoteInfo');
      const isUp = q.change >= 0;
      quoteInfo.className = `quote-badge ${isUp ? 'quote-up' : 'quote-down'}`;
      quoteInfo.innerText = `$${q.close} (${isUp ? '+' : ''}${q.change}, ${isUp ? '+' : ''}${q.change_pct}%)`;

      const f = data.fundamental || {};
      document.getElementById('fundPE').innerText = f.pe_ratio || 'N/F';
      document.getElementById('fundPB').innerText = f.pb_ratio || 'N/F';
      document.getElementById('fundYield').innerText = f.div_yield || 'N/F';

      document.getElementById('chartTitle').innerText = `📉 ${displayName} K 線圖`;

      document.getElementById('signalText').innerText = `[${data.signal}]`;
      const badge = document.getElementById('scoreBadge');
      const score = data.score;
      badge.innerText = `${score} 分`;
      
      if (score >= 60) {
        badge.className = 'score-badge score-high';
      } else if (score >= 50) {
        badge.className = 'score-badge score-mid';
      } else {
        badge.className = 'score-badge score-low';
      }

      document.getElementById('pEntry').innerText = `$${data.trade_plan.entry}`;
      document.getElementById('pStop').innerText = `$${data.trade_plan.stop_loss}`;
      document.getElementById('pTake').innerText = `$${data.trade_plan.take_profit}`;
      
      const profitElem = document.getElementById('pProfit');
      const profitVal = data.trade_plan.profit_pct;
      profitElem.innerText = `${profitVal > 0 ? '+' : ''}${profitVal}%`;
      profitElem.style.color = '#089981';

      document.getElementById('strategyAdvice').innerText = data.strategy_advice || '無具體操盤建議。';

      const reasonsContainer = document.getElementById('reasonsContainer');
      reasonsContainer.innerHTML = '';
      const breakdown = data.score_breakdown || [];
      if (breakdown.length > 0) {
        breakdown.forEach(item => {
          const div = document.createElement('div');
          div.className = 'reason-item';
          const isPlus = item.type === 'PLUS';
          div.innerHTML = `
            <span class="delta-tag ${isPlus ? 'tag-plus' : 'tag-minus'}">${item.delta}</span>
            <span>${item.reason}</span>
          `;
          reasonsContainer.appendChild(div);
        });
      }

      const newsList = document.getElementById('newsList');
      newsList.innerHTML = '';
      if (data.news && data.news.length > 0) {
        data.news.forEach(n => {
          const div = document.createElement('div');
          div.className = 'news-item';
          const googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(n.title)}`;
          div.innerHTML = `<a href="${googleSearchUrl}" target="_blank" rel="noopener noreferrer" class="news-link">${n.title}</a><span class="news-date">${n.date}</span>`;
          newsList.appendChild(div);
        });
        newsCard.style.display = 'block';
      }

      resultCard.style.display = 'block';
      addLog('INFO', '個股分析渲染完畢');
    } catch (err) {
      addLog('ERROR', `分析過程發生例外錯誤: ${err.message}`, err.stack);
      alert('分析失敗：' + err.message);
    } finally {
      loading.style.display = 'none';
    }
  }

  window.onload = () => {
    addLog('INFO', '網頁載入完成，初始化圖表並預設執行分析');
    initChart();
    analyzeStock();
  };
</script>

</body>
</html>
